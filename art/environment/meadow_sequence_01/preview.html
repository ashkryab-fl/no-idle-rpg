<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Луки → струмок → пшениця</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#17221d;color:#edf4ec;font:16px system-ui}h1{font-size:20px;font-weight:500}p{color:#b9cabd}.viewport{overflow:hidden;width:100%;height:240px;max-width:2160px}.track{display:flex;width:4320px;height:240px;animation:panorama 30s linear infinite}.track img{width:720px;height:240px;flex:0 0 720px}.compact{width:400px;max-width:100%;height:120px}.compact .track{width:2400px;height:120px;animation:game 18s linear infinite}.compact img{width:400px;height:120px;flex-basis:400px}button{margin:16px 0;padding:8px 16px;font:inherit;cursor:pointer}.join{display:flex;overflow:hidden;width:360px;height:120px}.edge{width:180px;height:120px;background-size:360px 120px;background-repeat:no-repeat}.right{background-position:right}.left{background-position:left}.joins{display:flex;flex-wrap:wrap;gap:18px}.joins p{font-size:14px}.paused .track{animation-play-state:paused}@keyframes panorama{to{transform:translateX(-2160px)}}@keyframes game{to{transform:translateX(-1200px)}}
</style>
<h1>Луки → струмок → пшениця → луки</h1>
<div class="viewport"><div class="track" id="wide"></div></div>
<button id="toggle">Пауза</button>
<p>Ігровий розмір 400 × 120</p>
<div class="viewport compact"><div class="track" id="compact"></div></div>
<p>Три переходи крупним планом</p>
<div class="joins" id="joins"></div>
<script>
const images=['background_meadow_01.png','background_stream_02.png','background_wheat_03.png'];
const path='../../../assets/environment/';
for(const id of ['wide','compact']){const track=document.getElementById(id);for(const name of [...images,...images]){const img=document.createElement('img');img.src=path+name;img.alt=name;track.append(img)}}
for(let i=0;i<3;i++){const group=document.createElement('div');const caption=document.createElement('p');caption.textContent=`${i+1} → ${(i+1)%3+1}`;const join=document.createElement('div');join.className='join';for(const [name,side] of [[images[i],'right'],[images[(i+1)%3],'left']]){const edge=document.createElement('div');edge.className='edge '+side;edge.style.backgroundImage=`url('${path+name}')`;join.append(edge)}group.append(caption,join);document.getElementById('joins').append(group)}
document.getElementById('toggle').onclick=function(){const paused=document.body.classList.toggle('paused');this.textContent=paused?'Продовжити':'Пауза'};
</script>
</html>
