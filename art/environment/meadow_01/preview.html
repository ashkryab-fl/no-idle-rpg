<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Луки — перевірка прокручування</title>
<style>
body{margin:0;padding:32px;background:#17221d;color:#edf4ec;font:16px system-ui}
h1{font-size:20px;font-weight:500}
p{color:#b9cabd}
.landscape{height:240px;background-image:url('../../../assets/environment/background_meadow_01.png');background-size:720px 240px;background-repeat:repeat-x;animation:scroll 18s linear infinite}
.compact{width:400px;max-width:100%;height:120px;background-size:400px 120px;animation-name:compact;animation-duration:10s}
@keyframes scroll{to{background-position-x:-720px}}
@keyframes compact{to{background-position-x:-400px}}
button{margin:16px 0;padding:8px 16px;font:inherit;cursor:pointer}
</style>
<h1>Зелені луки</h1>
<p>Повтор панорами та безперервне горизонтальне прокручування.</p>
<div class="landscape"></div>
<button id="toggle">Пауза</button>
<p>Розмір ігрового фону: 400 × 120.</p>
<div class="landscape compact"></div>
<script>
document.querySelector('#toggle').onclick=function(){const paused=this.textContent==='Пауза';document.querySelectorAll('.landscape').forEach(el=>el.style.animationPlayState=paused?'paused':'running');this.textContent=paused?'Продовжити':'Пауза'};
</script>
</html>
